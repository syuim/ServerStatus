<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <link rel="stylesheet" href="<%= BASE_URL %>css/semantic.min.css">
    <script src="<%= BASE_URL %>config.js"></script>
    <link rel="icon" href="<%= BASE_URL %>favicon.ico">
    <title><%= htmlWebpackPlugin.options.title %></title>
</head>
<body>
<noscript>
    <strong>We're sorry but <%= htmlWebpackPlugin.options.title %> doesn't work properly without JavaScript enabled.
        Please enable it to continue.</strong>
</noscript>
<div id="initial-loader" class="hotaru-initial-loader" style="position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;background:#fff;color:#616366;font-size:16px;letter-spacing:.02em;transition:opacity .32s cubic-bezier(.2,.8,.2,1);">
  <span class="hotaru-initial-loader__text">加载中<span class="hotaru-initial-loader__ellipsis" style="display:inline-block;width:1em;text-align:left;letter-spacing:.05em;"><span>.</span><span>.</span><span>.</span></span></span>
</div>
<div id="app"></div>
<!-- built files will be auto injected -->
</body>
</html>
